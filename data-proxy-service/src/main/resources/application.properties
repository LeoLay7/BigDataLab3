
spring.application.name=data-proxy-service

# Kafka (используется адрес внутри docker-compose)
spring.kafka.bootstrap-servers=kafka:9092

# Топик по умолчанию
app.kafka.topic=mock-data

# Папка с исходными CSV (в контейнере будет смонтирована в /data)
app.source.directory=/data
app.source.pattern=*.csv
app.source.recursive=true

# Лимит паузы между отправками в мс (0 = без паузы)
app.source.delay-ms=0

# Режим: single-run или loop
app.source.mode=single-run

# Порт приложения
server.port=8080

# JPA: схема уже существует в PostgreSQL, поэтому Hibernate не генерирует её самостоятельно
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Детализация логирования прокси
app.kafka.log.every-n-messages=500
logging.level.org.homework.dataproxyservice=INFO

